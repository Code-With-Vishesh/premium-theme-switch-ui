<title>Premium Theme Switch</title>
<script>
  /* Theme init — runs before first paint to avoid a flash of the wrong theme */
  (function(){
    try{
      var KEY = 'premium-switch-theme';
      var stored = localStorage.getItem(KEY);
      var theme = stored ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        document.documentElement.setAttribute('data-motion','reduced');
      }
    }catch(e){
      document.documentElement.setAttribute('data-theme','light');
    }
  })();
</script>

    --bg-a:#f8fafc;
    --bg-b:#eef6ff;
    --card:#ffffff;
    --card-border:rgba(15,23,42,0.06);
    --text:#12203c;
    --muted:#68728a;
    --heading:#16305e;
    --accent:#2f6bff;
    --shadow:0 15px 40px rgba(15,23,42,0.08);
    --card-shadow-hover:0 18px 46px rgba(15,23,42,0.11);
    --code-bg:#151619;
    --code-text:#d4d4d4;
    --focus-ring:#2f6bff;

    --t-fast:.25s;
    --t-mid:.45s;
    --t-slow:.6s;
    --ease:cubic-bezier(.4,0,.2,1);
  }

  html[data-theme="dark"]{
    --bg-a:#080b12;
    --bg-b:#101522;
    --card:rgba(24,27,36,0.95);
    --card-border:rgba(255,255,255,0.06);
    --text:#eef1f8;
    --muted:#8b93a8;
    --heading:#eaf0ff;
    --accent:#7d9cff;
    --shadow:0 15px 40px rgba(0,0,0,0.45);
    --card-shadow-hover:0 20px 50px rgba(0,0,0,0.55);
    --focus-ring:#8fb0ff;
  }

  /* Reduced motion: shorten / neutralize non-essential animation */
  html[data-motion="reduced"] *{
    animation-duration:0.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.12s !important;
    scroll-behavior:auto !important;
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:32px 16px;
    background:linear-gradient(135deg, var(--bg-a), var(--bg-b));
    transition:background var(--t-slow) var(--ease);
  }

  .wrap{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  h1.heading{
    text-align:center;
    font-size:21px;
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
    color:var(--heading);
    transition:color var(--t-slow) var(--ease);
  }
  .subtitle{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:2.5px;
    margin-top:6px;
    text-transform:uppercase;
    transition:color var(--t-slow) var(--ease);
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:30px 24px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    transition:background var(--t-slow) var(--ease), border-color var(--t-slow) var(--ease),
               box-shadow var(--t-mid) var(--ease);
  }
  .card:hover{ box-shadow:var(--card-shadow-hover); }
  .card .title{
    font-weight:800;
    font-size:13px;
    letter-spacing:1.5px;
    color:var(--text);
    transition:color var(--t-slow) var(--ease);
  }

  /* ===== Premium switch ===== */
  .p-switch{
    --w:150px;
    --h:64px;
    --knob:56px;
    position:relative;
    width:var(--w);
    height:var(--h);
    flex:0 0 auto;
    display:block;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    border-radius:999px;
    transition:transform .18s var(--ease), filter .18s var(--ease);
  }
  .p-switch:hover{ transform:scale(1.03); filter:drop-shadow(0 6px 14px rgba(0,0,0,0.18)); }
  .p-switch.is-pressed{ transform:scale(0.97); }

  .p-switch input{
    position:absolute;
    inset:0;
    opacity:0;
    margin:0;
    cursor:pointer;
    z-index:2;
    width:100%;
    height:100%;
  }
  .p-switch input:focus-visible ~ .p-track{
    outline:3px solid var(--focus-ring);
    outline-offset:3px;
  }

  .p-track{
    position:absolute;
    inset:0;
    border-radius:999px;
    background:#0b0c10 var(--track-img-day) center/cover no-repeat;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.6),
      0 3px 10px rgba(0,0,0,0.25);
    transition:background-image var(--t-mid) var(--ease), outline-color var(--t-fast) var(--ease);
    overflow:hidden;
  }
  .p-switch input:checked ~ .p-track{
    background-image:var(--track-img-night);
  }
  .p-track::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.25));
    pointer-events:none;
  }

  /* subtle twinkling stars, visible only in night mode, layered above the photo */
  .p-track .star{
    position:absolute;
    width:2.5px;
    height:2.5px;
    border-radius:50%;
    background:#fff;
    opacity:0;
    pointer-events:none;
    transition:opacity var(--t-mid) var(--ease);
    animation:twinkle 3.2s ease-in-out infinite;
  }
  .p-switch input:checked ~ .p-track .star{ opacity:.85; }
  .star1{ top:14px; left:34px; animation-delay:.2s; }
  .star2{ top:26px; left:58px; animation-delay:1.1s; }
  .star3{ top:12px; left:78px; animation-delay:1.9s; }
  @keyframes twinkle{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.4); }
  }

  .p-knob{
    position:absolute;
    top:4px;
    left:4px;
    width:var(--knob);
    height:var(--knob);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:left var(--t-mid) cubic-bezier(.65,0,.35,1), background var(--t-mid) var(--ease), box-shadow var(--t-mid) var(--ease);
    background:radial-gradient(circle at 35% 30%, #ffe08a, #ffb545 55%, #ef8a15 100%);
    box-shadow:
      0 0 0 7px rgba(255,181,69,0.16),
      0 3px 8px rgba(0,0,0,0.4);
    z-index:1;
  }
  .p-switch input:checked ~ .p-knob{
    left:calc(var(--w) - var(--knob) - 4px);
    background:radial-gradient(circle at 35% 30%, #7d8492, #4a505c 55%, #262a31 100%);
    box-shadow:
      0 0 0 7px rgba(255,255,255,0.05),
      0 3px 8px rgba(0,0,0,0.5);
  }
  /* gentle glow pulse behind the knob — sun warmth / moon glow, kept subtle */
  .p-knob::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,193,92,0.35), transparent 70%);
    animation:pulse-glow 3.6s ease-in-out infinite;
    z-index:-1;
  }
  .p-switch input:checked ~ .p-knob::before{
    background:radial-gradient(circle, rgba(180,195,255,0.28), transparent 70%);
  }
  @keyframes pulse-glow{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  .p-knob svg{ width:22px; height:22px; position:absolute; transition:opacity var(--t-fast) var(--ease), transform var(--t-mid) var(--ease); }
  .p-knob .k-sun{ color:#fff6e0; opacity:1; transform:scale(1) rotate(0deg); }
  .p-knob .k-moon{ color:#e9ebf0; opacity:0; transform:scale(.5) rotate(-45deg); }
  .p-switch input:checked ~ .p-knob .k-sun{ opacity:0; transform:scale(.5) rotate(45deg); }
  .p-switch input:checked ~ .p-knob .k-moon{ opacity:1; transform:scale(1) rotate(0deg); }

  .mode-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:1.5px;
    color:var(--muted);
    text-transform:uppercase;
    min-height:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color var(--t-slow) var(--ease);
  }
  .mode-label .mode-text{
    display:inline-block;
    transition:opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
  }
  .mode-label .mode-text.fading{
    opacity:0;
    transform:translateY(4px);
  }

  /* ===== Code reference panel ===== */
  .code-card{
    background:var(--code-bg);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,0.25);
    border:1px solid rgba(255,255,255,0.04);
  }
  .code-tabs{
    display:flex;
    align-items:center;
    background:#0f1012;
  }
  .code-tabs .dot-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
  }
  .code-tabs .dot{ width:10px; height:10px; border-radius:50%; }
  .code-tabs .dot.r{ background:#ff5f57; }
  .code-tabs .dot.y{ background:#febc2e; }
  .code-tabs .dot.g{ background:#28c840; }
  .code-tabs .tab-title{
    flex:1;
    text-align:center;
    font-size:12px;
    color:#8b8f97;
    padding:9px 0;
    font-weight:600;
    letter-spacing:.5px;
    transition:opacity var(--t-fast) var(--ease);
  }
  .code-tabs .tab-title.fading{ opacity:0; }
  .code-tabs .spacer{ width:64px; }

  .code-body{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    transition:opacity var(--t-fast) var(--ease);
  }
  .code-body.fading{ opacity:0; }
  .code-col{
    padding:14px;
    overflow-x:auto;
    border-right:1px solid #26282e;
    max-width:100%;
    -webkit-overflow-scrolling:touch;
  }
  .code-col:last-child{ border-right:none; }
  .code-col::-webkit-scrollbar{ height:6px; }
  .code-col::-webkit-scrollbar-thumb{ background:#3a3d45; border-radius:3px; }
  .code-col h4{
    margin:0 0 8px 0;
    font-size:10px;
    letter-spacing:1.5px;
    color:#6d90ff;
    text-transform:uppercase;
  }
  .code-col pre{
    margin:0;
    font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    font-size:11.5px;
    line-height:1.65;
    color:var(--code-text);
    white-space:pre;
  }
  .tag{ color:#569cd6; }
  .attr{ color:#9cdcfe; }
  .str{ color:#ce9178; }
  .prop{ color:#9cdcfe; }
  .val{ color:#ce9178; }
  .sel{ color:#d7ba7d; }
  .cmt{ color:#6a9955; }
  .kw{ color:#c586c0; }

  @media (max-width:480px){
    .code-body{ grid-template-columns:1fr; }
    .code-col{ border-right:none; border-bottom:1px solid #26282e; }
    .p-switch{ --w:130px; --h:58px; --knob:50px; }
    h1.heading{ font-size:18px; }
    .card{ padding:24px 18px; }
  }
  @media (max-width:340px){
    .p-switch{ --w:112px; --h:52px; --knob:44px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="heading">Theme Switch UI Upgrade<span class="subtitle">HTML | CSS</span></h1>

    <div class="card" id="mainCard">
      <span class="title">PREMIUM SWITCH UI</span>

      <label class="p-switch" id="pSwitch">
        <input type="checkbox" id="themeToggle" role="switch" aria-label="Toggle between day and night mode">
        <span class="p-track">
          <span class="star star1"></span>
          <span class="star star2"></span>
          <span class="star star3"></span>
        </span>
        <span class="p-knob">
          <svg class="k-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2"/><path d="M12 19.3v2.2"/><path d="M3.5 12h2.2"/><path d="M18.3 12h2.2"/><path d="M5.6 5.6l1.6 1.6"/><path d="M16.8 16.8l1.6 1.6"/><path d="M5.6 18.4l1.6-1.6"/><path d="M16.8 7.2l1.6-1.6"/></g></svg>
          <svg class="k-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 019.5 3.5a6.8 6.8 0 108.6 8.6c.4-.1.9.2 1.1.5.2.3.1.7-.7.9z"/></svg>
        </span>
      </label>

      <span class="mode-label"><span class="mode-text" id="modeLabel">Day Mode</span></span>
    </div>

    <div class="code-card">
      <div class="code-tabs">
        <div class="dot-row">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        </div>
        <div class="tab-title" id="codeTabTitle">Day Mode Reference</div>
        <div class="spacer"></div>
      </div>
      <div class="code-body" id="codeBody">
        <div class="code-col">
          <h4>HTML</h4>
          <pre id="htmlCode"></pre>
        </div>
        <div class="code-col">
          <h4>CSS / JS</h4>
          <pre id="cssCode"></pre>
        </div>
      </div>
    </div>
  </div>

<script>
const htmlSnippet =
'<span class="tag">&lt;label</span> <span class="attr">class</span>=<span class="str">"p-switch"</span><span class="tag">&gt;</span>\n' +
'  <span class="tag">&lt;input</span> <span class="attr">type</span>=<span class="str">"checkbox"</span>\n' +
'    <span class="attr">role</span>=<span class="str">"switch"</span>\n' +
'    <span class="attr">aria-label</span>=<span class="str">"Toggle theme"</span><span class="tag">&gt;</span>\n' +
'  <span class="tag">&lt;span</span> <span class="attr">class</span>=<span class="str">"p-track"</span><span class="tag">&gt;&lt;/span&gt;</span>\n' +
'  <span class="tag">&lt;span</span> <span class="attr">class</span>=<span class="str">"p-knob"</span><span class="tag">&gt;&lt;/span&gt;</span>\n' +
'<span class="tag">&lt;/label&gt;</span>';

const cssDay =
'<span class="cmt">/* Day mode \u2014 sky photo track */</span>\n' +
'<span class="sel">.p-track</span> {\n' +
'  <span class="prop">background</span>: <span class="val">var(--track-img-day)</span>\n' +
'    <span class="val">center/cover no-repeat</span>;\n' +
'}\n\n' +
'<span class="sel">html[data-theme="light"]</span> {\n' +
'  <span class="prop">--bg-a</span>: <span class="val">#f8fafc</span>;\n' +
'  <span class="prop">--bg-b</span>: <span class="val">#eef6ff</span>;\n' +
'  <span class="prop">--card</span>: <span class="val">#ffffff</span>;\n' +
'}\n\n' +
'<span class="cmt">/* respects reduced-motion users */</span>\n' +
'<span class="kw">@media</span> (prefers-reduced-motion: reduce) {\n' +
'  <span class="sel">*</span> { <span class="prop">transition-duration</span>: <span class="val">.12s</span>; }\n' +
'}';

const cssNight =
'<span class="cmt">/* Night mode \u2014 moon &amp; stars photo */</span>\n' +
'<span class="sel">.p-switch input:checked ~ .p-track</span> {\n' +
'  <span class="prop">background-image</span>:\n' +
'    <span class="val">var(--track-img-night)</span>;\n' +
'}\n\n' +
'<span class="sel">html[data-theme="dark"]</span> {\n' +
'  <span class="prop">--bg-a</span>: <span class="val">#080b12</span>;\n' +
'  <span class="prop">--bg-b</span>: <span class="val">#101522</span>;\n' +
'  <span class="prop">--card</span>: <span class="val">rgba(24,27,36,.95)</span>;\n' +
'}\n\n' +
'<span class="cmt">// persisted + system-aware theme</span>\n' +
'<span class="kw">const</span> KEY = <span class="str">\'premium-switch-theme\'</span>;\n' +
'toggle.addEventListener(<span class="str">\'change\'</span>, () =&gt; {\n' +
'  <span class="kw">const</span> theme = toggle.checked ? <span class="str">\'dark\'</span> : <span class="str">\'light\'</span>;\n' +
'  localStorage.setItem(KEY, theme);\n' +
'  document.documentElement.setAttribute(<span class="str">\'data-theme\'</span>, theme);\n' +
'});';

const KEY = 'premium-switch-theme';
const toggle = document.getElementById('themeToggle');
const pSwitch = document.getElementById('pSwitch');
const modeLabel = document.getElementById('modeLabel');
const codeTabTitle = document.getElementById('codeTabTitle');
const codeBody = document.getElementById('codeBody');
const htmlCode = document.getElementById('htmlCode');
const cssCode = document.getElementById('cssCode');

htmlCode.innerHTML = htmlSnippet;

function currentThemeIsDark(){
  return document.documentElement.getAttribute('data-theme') === 'dark';
}

/* Sync the checkbox with whatever theme was applied by the head-inline script */
toggle.checked = currentThemeIsDark();

function paintForTheme(isDark, animate){
  const doPaint = () => {
    modeLabel.textContent = isDark ? 'Night Mode' : 'Day Mode';
    codeTabTitle.textContent = isDark ? 'Night Mode Reference' : 'Day Mode Reference';
    cssCode.innerHTML = isDark ? cssNight : cssDay;
    if(animate){
      modeLabel.classList.remove('fading');
      codeTabTitle.classList.remove('fading');
      codeBody.classList.remove('fading');
    }
  };
  if(!animate){
    doPaint();
    return;
  }
  modeLabel.classList.add('fading');
  codeTabTitle.classList.add('fading');
  codeBody.classList.add('fading');
  window.setTimeout(doPaint, 180);
}

/* Initial paint (no fade, avoids flash on load) */
paintForTheme(toggle.checked, false);

toggle.addEventListener('change', () => {
  const theme = toggle.checked ? 'dark' : 'light';
  try{ localStorage.setItem(KEY, theme); }catch(e){}
  document.documentElement.setAttribute('data-theme', theme);
  paintForTheme(toggle.checked, true);
});

/* Tactile press feedback, mouse + keyboard */
function press(){ pSwitch.classList.add('is-pressed'); }
function release(){ pSwitch.classList.remove('is-pressed'); }
pSwitch.addEventListener('pointerdown', press);
pSwitch.addEventListener('pointerup', release);
pSwitch.addEventListener('pointerleave', release);
toggle.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'Enter') press(); });
toggle.addEventListener('keyup', release);

/* Follow the OS theme only if the user has never manually chosen one */
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
    if(localStorage.getItem(KEY)) return;
    const theme = e.matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    toggle.checked = theme === 'dark';
    paintForTheme(toggle.checked, true);
  });
}catch(e){}
</script>
</body>
</html>
